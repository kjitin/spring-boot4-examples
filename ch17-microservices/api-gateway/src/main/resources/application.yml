server:
  port: 8080

# Spring Cloud Gateway 5: properties moved from spring.cloud.gateway.* to spring.cloud.gateway.server.webflux.*
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery.locator:
            enabled: true # Enable discovery-aware routing
            lower-case-service-id: true
          routes:
            - id: product_service_route
              uri: lb://product-service # Route to product-service discovered via Eureka
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=2 # Remove /api/products from the path before forwarding
                - name: CircuitBreaker
                  args:
                    name: productServiceCircuitBreaker
                    fallbackUri: forward:/fallback/products
            - id: order_service_route
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=2

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
