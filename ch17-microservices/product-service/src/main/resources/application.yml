server:
  port: 8082

spring:
  application:
    name: product-service # This name corresponds to the config file in the Git repo (e.g., product-service.yml)
  # Spring Boot 4 / Spring Cloud 2025: bootstrap.yml is replaced by spring.config.import
  config:
    import: "optional:configserver:http://localhost:8888" # Address of the Config Server

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
