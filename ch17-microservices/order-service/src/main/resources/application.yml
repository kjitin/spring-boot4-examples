server:
  port: 8083

spring:
  application:
    name: order-service
  # Consul KV configuration (replaces bootstrap-based loading in current Spring Cloud versions)
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        instance-id: ${spring.application.name}:${random.value}
      config:
        enabled: true
        prefix: config # Prefix for keys in Consul KV store
        default-context: application
        profile-separator: ":"
    stream:
      bindings:
        order-out:
          destination: order-events # Kafka topic name
          contentType: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers

resilience4j.circuitbreaker:
  instances:
    productService:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 10 # Number of calls to consider for statistics
      failureRateThreshold: 50 # Percentage of failures to open the circuit
      waitDurationInOpenState: 5s # How long the circuit stays open
      permittedNumberOfCallsInHalfOpenState: 3 # Number of calls allowed in half-open state
      automaticTransitionFromOpenToHalfOpenEnabled: true
