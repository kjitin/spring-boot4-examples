spring.application.name=ch19-webflux

# CASE_INSENSITIVE_IDENTIFIERS: Spring Data R2DBC quotes identifiers ("products"), while H2 stores unquoted DDL names in upper case
spring.r2dbc.url=r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.r2dbc.generate-unique-name=false
