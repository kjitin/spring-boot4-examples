spring.application.name=secure-service

# Service-to-service calls with the OAuth2 client_credentials grant
spring.security.oauth2.client.registration.internal-service-client.client-id=my-service-client-id
spring.security.oauth2.client.registration.internal-service-client.client-secret=my-service-client-secret
spring.security.oauth2.client.registration.internal-service-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.internal-service-client.scope=service.read,service.write
spring.security.oauth2.client.provider.internal-service-client.token-uri=http://localhost:8080/realms/master/protocol/openid-connect/token

# Credentials come from Vault (profile "vault") or fall back to local defaults
spring.datasource.url=jdbc:h2:mem:secure;DB_CLOSE_DELAY=-1
spring.datasource.username=${datasource.username:sa}
spring.datasource.password=${datasource.password:}

# Vault is only used with the "vault" profile
spring.cloud.vault.enabled=false
