# Spring Cloud Vault. The book uses bootstrap.properties and the "generic" backend; current versions use
# spring.config.import and the key/value ("kv") backend instead.
spring.config.import=vault://
spring.cloud.vault.enabled=true
spring.cloud.vault.scheme=http
spring.cloud.vault.host=localhost
spring.cloud.vault.port=8200
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=s.YOUR_VAULT_ROOT_TOKEN
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=application

# Separate in-memory database created with the Vault-provided credentials
spring.datasource.url=jdbc:h2:mem:secure-vault;DB_CLOSE_DELAY=-1
