spring.application.name=my-spring-app

# Metrics: expose Prometheus scrape endpoint
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}

# Tracing (OpenTelemetry). Note: no inline "# comments" after values in .properties files -
# they become part of the value (the book's "1.0 # Sample all traces" would not parse).
management.tracing.enabled=true
# Sample all traces
management.tracing.sampling.probability=1.0

# Configure Zipkin exporter (Boot 4 name; the book's management.zipkin.tracing.endpoint was removed)
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Health details
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.redis.enabled=true
