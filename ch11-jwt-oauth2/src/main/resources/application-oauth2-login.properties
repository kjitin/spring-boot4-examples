# OAuth2 / OIDC login (activate with --spring.profiles.active=oauth2-login together with OAuth2LoginConfig).
# issuer-uri triggers OIDC discovery at startup, so the provider must be reachable.

# Okta Example
spring.security.oauth2.client.registration.okta.client-id=YOUR_OKTA_CLIENT_ID
spring.security.oauth2.client.registration.okta.client-secret=YOUR_OKTA_CLIENT_SECRET
spring.security.oauth2.client.registration.okta.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.okta.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.okta.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.okta.scope=openid,profile,email
spring.security.oauth2.client.provider.okta.issuer-uri=https://{yourOktaDomain}/oauth2/default

# Keycloak Example (assuming Keycloak is running on localhost:8080)
spring.security.oauth2.client.registration.keycloak.client-id=spring-client
spring.security.oauth2.client.registration.keycloak.client-secret=YOUR_KEYCLOAK_CLIENT_SECRET
spring.security.oauth2.client.registration.keycloak.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/master
