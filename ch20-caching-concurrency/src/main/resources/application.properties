spring.application.name=ch20-caching-concurrency

# Local in-memory cache with Caffeine
spring.cache.type=caffeine
spring.cache.cache-names=products
spring.cache.caffeine.spec=expireAfterAccess=60s,maximumSize=500

# HikariCP connection pool tuning. Comments are on their own lines: in .properties files an
# inline "# comment" after a value becomes part of the value (as written in the book they would not parse).
# Max number of connections in the pool
spring.datasource.hikari.maximum-pool-size=10
# Min number of idle connections
spring.datasource.hikari.minimum-idle=2
# Max wait for a connection (ms)
spring.datasource.hikari.connection-timeout=30000
# Max idle time for a connection (ms)
spring.datasource.hikari.idle-timeout=600000
# Max lifetime of a connection (ms)
spring.datasource.hikari.max-lifetime=1800000
