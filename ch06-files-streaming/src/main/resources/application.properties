spring.application.name=ch06-files-streaming

# Maximum file size for a single file (e.g., 10MB)
spring.servlet.multipart.max-file-size=10MB
# Maximum request size (total of all files + form data)
spring.servlet.multipart.max-request-size=100MB
# Threshold for storing files in memory (files larger than this are written to disk)
spring.servlet.multipart.file-size-threshold=2KB
# Directory where temporary files are stored
spring.servlet.multipart.location=/tmp

# Behind a reverse proxy: honour X-Forwarded-* headers
server.forward-headers-strategy=FRAMEWORK
# Serve the app under a context path (uncomment to try)
#server.servlet.context-path=/my-app
