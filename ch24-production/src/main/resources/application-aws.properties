# application.properties (AWS)
management.metrics.export.cloudwatch.enabled=true
management.metrics.export.cloudwatch.namespace=MySpringBootApp

# Send spans to the AWS Distro for OpenTelemetry collector (forwards to X-Ray)
management.opentelemetry.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
